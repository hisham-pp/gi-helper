name: Scrape Materials Daily

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.17.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Data Sync Pipeline
        run: pnpm run sync-data

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update game data (materials, characters, weapons, artifact sets) and the scanner atlases"
          # Everything sync-data writes: without the atlases, new materials, weapons,
          # artifact sets or characters would show in the database but the on-device
          # scanner couldn't recognise them.
          file_pattern: "src/data/materials.json src/data/other-materials.json src/data/characters.json src/data/weapons.json src/data/artifact-sets.json public/images/materials/ public/images/material-thumbs/ public/images/character-avatars/ public/images/weapons/ public/images/weapons-awakened/ public/images/weapons-alt/ public/images/artifacts/ public/data/"
